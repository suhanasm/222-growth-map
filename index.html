function chips(){var c=[["all","All "+T.length],["gap","No 222 event ("+GAP.length+")"],["cov","Has a 222 event ("+COV.length+")"]];return '<div class="chips">'+c.map(function(x){return '<button class="chip'+(S.f===x[0]?' on':'')+'" data-a="f" data-v="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>';}
function clusters(){var mx=CL[0].sum;return CL.map(function(c){var v=VEN.filter(function(x){return x.town===c.hub})[0];
  return '<div class="card cl" style="border-left:4px solid '+c.c+'"><div class="top"><h3>'+esc(c.n)+'</h3><span class="n" style="color:'+c.c+'">'+num(c.sum)+'</span></div><p class="small muted" style="margin:2px 0 0">'+c.list.length+' towns · co-op placements</p><div class="track"><div class="fill" style="width:'+(c.sum/mx*100).toFixed(1)+'%;background:'+c.c+'"></div></div><div class="tw">'+c.list.map(function(t){return '<button class="twb" data-a="t" data-v="'+esc(t.n)+'" data-from="list">'+esc(t.n)+'<b>'+num(t.t)+'</b></button>';}).join("")+'</div><p class="small" style="margin:12px 0 0"><b>Hub:</b> '+esc(c.hub)+(v?' · <span class="muted">'+esc(v.n)+'</span>':'')+'</p></div>';}).join("");}
function venues(){return VEN.map(function(v){var t=tw(v.town);return '<div class="card"><span class="tag" style="border-color:'+t.cl.c+';color:'+t.cl.c+'">'+esc(t.cl.n)+' hub · '+esc(v.town)+'</span><h3>'+esc(v.n)+'</h3><p class="small muted">'+esc(v.t)+' · '+esc(v.a)+'</p><ul class="small" style="margin:8px 0;padding-left:18px">'+v.f.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul><p class="small" style="margin:0"><b>To confirm:</b> <span class="muted">'+esc(v.c)+'</span></p></div>';}).join("");}
function video(){return ME.video?'<a class="vid" href="'+esc(ME.video)+'" target="_blank" rel="noopener">'+(ME.thumb?'<img src="'+esc(ME.thumb)+'" alt="">':'')+'<span><b>Watch the 60-second walkthrough</b><span class="small muted">Suhana explains the map in one minute.</span></span></a>':'';}
function photo(){return ME.photo?'<figure><img src="'+esc(ME.photo)+'" alt="'+esc(ME.photoCaption)+'"><figcaption>'+esc(ME.photoCaption)+'</figcaption></figure>':'';}
function render(){
  var w=tw("Waltham"),names=COV.map(function(t){return t.n;});
  var evList=names.slice(0,-1).join(", ")+" and "+names[names.length-1];
  var pc=Math.round(CS/TOTAL*100),pg=100-pc,cg='linear-gradient(90deg,'+CL.map(function(c,i){return c.c+' '+(i*25)+'% '+((i+1)*25)+'%';}).join(',')+')';
  var reach=GAP.filter(function(t){return mi(w,t)<=10;}),rs=sum(reach),bu=tw("Burlington"),rbl=GAP.filter(function(t){return mi(bu,t)<=10;}),rb=sum(rbl);
  var lg='<span><b>No 222 event:</b></span>'+CL.map(function(c){return '<span><span class="sw" style="background:'+c.c+'"></span>'+esc(c.n)+'</span>';}).join("");
  app.innerHTML='<div id="top"></div><p class="eyebrow">Northeastern co-op × 222</p>'
  +'<h1>Where 222 could go next: <span class="pop">'+num(GS)+'</span> co-op placements across <span class="pop">'+GAP.length+' towns</span> with no 222 events.</h1>'
  +'<p class="lede">Northeastern students on co-op can end up in a town where they know no one. This page shows where they are, where 222 has events, and where to host first.</p>'
  +'<div class="def"><b>What is a co-op?</b> A six-month, full-time, paid job that Northeastern students do during their degree, typically twice. More than 11,000 Northeastern students do one every year.</div>'
  +video()
  +'<div class="split"><p class="splitt"><b>'+num(TOTAL)+'</b> co-op placements in the 20 towns with the most</p><div class="splitbar"><i style="width:'+pc+'%;background:var(--live);opacity:.8"></i>'+CL.map(function(c){return '<i style="width:'+(c.sum/TOTAL*100).toFixed(2)+'%;background:'+c.c+'"></i>';}).join("")+'</div>'
  +'<div class="splitrow"><span class="k" style="background:var(--live)"></span><p><b>'+num(CS)+'</b> <span class="muted">('+pc+'%)</span> are in '+esc(evList)+', where 222 has events.</p></div>'
  +'<div class="splitrow"><span class="k" style="background:'+cg+'"></span><p><b>'+num(GS)+'</b> <span class="muted">('+pg+'%)</span> are in the other '+GAP.length+' towns, where 222 has no events. <span class="muted">The colors are the '+CL.length+' clusters below.</span></p></div></div>'
  +'<h2>The story in four steps</h2>'
  +'<div class="step"><i>1</i><p><b>The people.</b> Every semester, Northeastern students start a co-op, and some land in a place that is new to them, with their usual friends somewhere else.</p></div>'
  +'<div class="step"><i>2</i><p><b>The need.</b> 222 gives people the chance to meet through curated, in-person experiences instead of having to arrange it themselves.</p></div>'
  +'<div class="step"><i>3</i><p><b>The gap.</b> In '+GAP.length+' towns where students work, '+num(GS)+' placements in all, 222 has no events. It shows up in every co-op cycle from Fall 2024 to Spring 2026.</p></div>'
  +'<div class="step"><i>4</i><p><b>The start.</b> I grouped those '+GAP.length+' towns into '+CL.length+' clusters by location, picked a candidate venue in each, and propose a first event in Waltham.</p></div>'
  +'<div class="note"><b>This is only Northeastern.</b> Students from other schools work in these towns too, so the real audience in each of these places is larger.</div>'
  +'<h2 id="map">Where they work, and where 222 has events</h2><p class="muted">Tap a town or an event for details.</p>'
  +'<div class="mapbox">'+mapSvg()+'<div class="legend" style="margin-bottom:0">'+lg+'</div><div class="legend" style="margin-top:4px"><span><b>Has a 222 event:</b></span><span><span class="sw cov"></span>Town</span><span><span class="sw ev"></span>Event location</span></div></div>'
  +'<p class="small muted">The map is schematic and not to scale. Rings show miles from downtown Boston, dot size shows placements, and counts are where students work, not where they live. 222 events are those listed in the 222 app in November 2026.</p>'
  +'<div id="panel">'+panel()+'</div>'
  +'<p class="small muted" style="margin:16px 0 8px"><b>All 20 towns</b> · tap a town for details</p>'+chips()+'<input type="text" id="q" placeholder="Search towns" value="'+esc(S.q)+'"><div class="lh"><span>Town</span><span>Co-op placements</span></div><div class="list" id="list">'+listHtml()+'</div>'
  +'<h2 id="gap">The gap, in '+CL.length+' clusters</h2><p class="muted">I sorted the '+GAP.length+' towns into '+CL.length+' clusters, which are groups of nearby towns. In each cluster, I would start in its hub, the town with the most co-op placements. Tap a town for details.</p>'+clusters()
  +'<h2 id="start">Where to start</h2><p class="muted">One venue in each cluster’s hub town, picked because it takes group bookings.</p>'+venues()
  +'<div class="card"><h3>Proposed first event: Waltham</h3><p class="small muted">Boston and Cambridge, the two largest towns, already have 222 events. Waltham is the next largest town and has no 222 events.</p><p class="small" style="margin:12px 0 2px"><b>Why I picked Waltham (next largest town) over Burlington (hub of the largest cluster)</b></p><table class="vs"><thead><tr><th></th><th>Waltham</th><th>Burlington</th></tr></thead><tbody><tr><td>Co-op placements</td><td>'+num(w.t)+'</td><td>'+num(bu.t)+'</td></tr><tr><td>Miles from Boston</td><td>'+w.mi+'</td><td>'+bu.mi+'</td></tr></tbody></table><p class="small" style="margin:10px 0 14px">Waltham has more co-op placements than Burlington and is closer to Boston.</p><p style="margin:8px 0"><b>Objective.</b> Bring a 222 experience to where co-op students already work, starting with Waltham.</p><p style="margin:0 0 8px"><b>Design.</b> One event at one Waltham venue, in 222’s usual format, promoted through Northeastern co-op channels.</p><p style="margin:0 0 8px"><b>Timing.</b> Over 90% of co-op placements start in January or June to August, so I would hold it a few weeks into one of those cycles.</p><p style="margin:0 0 8px"><b>Measures.</b> Sign-ups, attendance, distance traveled, and interest in a second event.</p><p style="margin:0"><b>My role.</b> Outreach, venue contact, coordination, and a written summary of results.</p></div>'
  +'<h2 id="about">About me</h2><div class="about"><p>I am '+esc(ME.name)+', a Northeastern student studying Business Administration and Data Science, graduating in May 2027.</p>'
  +'<p>I have called 4 countries home: India, Singapore, the UK for a semester, and now the US. Every move meant rebuilding my world from scratch, and the hardest part was never the place. It was not having anyone to explore it with. When I came back to Singapore, the city I grew up in, for my co-op, my friends had scattered to universities across the world. It was still home, yet it felt quiet.</p>'
  +'<p>222’s co-founder Danial Hashemi says people are not just running into each other anymore, and that the whole idea is engineering chance. I have lived that problem in 4 countries.</p>'
  +'<p>No student should have to feel that way in a place full of people. This page shows where I could start engineering chance for them in Greater Boston.</p>'
  +'<div class="ask"><h3>Would you be open to a <span style="white-space:nowrap">15-minute</span> call?</h3><p class="em">'+esc(ME.email)+'</p><p class="em">'+esc(ME.email2)+'</p></div></div>'
  +photo();
}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),v=b.getAttribute("data-v");
  if(a==="t"){S.sel=v;}else if(a==="o"){S.sel="o:"+v;}else if(a==="f"){S.f=v;}
  var fromList=b.getAttribute("data-from")==="list",y=window.scrollY;render();
  if(a==="f"){window.scrollTo(0,y);}else{document.getElementById("panel").scrollIntoView({behavior:"smooth",block:fromList?"center":"nearest"});}});
app.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){var b=e.target.closest("g[data-a]");if(b){e.preventDefault();b.dispatchEvent(new MouseEvent("click",{bubbles:true}));}}});
app.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;document.getElementById("list").innerHTML=listHtml();}});
render();
</script></body></html>
